name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # vitest 5 requires Node ^22.12.0 || ^24.0.0 || >=26.0.0 — Node 20
          # installs fine and even runs tsc/eslint/vite, but the "Test" step
          # crashes immediately under it, matching the "engines" floor below.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      # Each step runs even if an earlier one failed, so a single push reports
      # every problem at once instead of one per re-run.
      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Format
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Test
        if: ${{ !cancelled() }}
        run: npm run test

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
